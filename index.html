<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe — CS50x Final Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <div class="container">

      <header>
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">Two-player game</p>
      </header>

      <div class="scoreboard">
        <div class="score-block" id="score-x">
          <span class="score-symbol x-color">X</span>
          <span class="score-label">Player 1</span>
          <span class="score-value" id="score-x-value">0</span>
        </div>
        <div class="score-block draws">
          <span class="score-symbol draw-color">—</span>
          <span class="score-label">Draws</span>
          <span class="score-value" id="score-draws-value">0</span>
        </div>
        <div class="score-block" id="score-o">
          <span class="score-symbol o-color">O</span>
          <span class="score-label">Player 2</span>
          <span class="score-value" id="score-o-value">0</span>
        </div>
      </div>

      <div class="status" id="status">Player X's turn</div>

      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="btn-new-round">New Round</button>
        <button class="btn btn-secondary" id="btn-reset">Reset Scores</button>
      </div>

    </div>

    <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <div class="modal-icon" id="modal-icon"></div>
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <button class="btn btn-primary" id="btn-modal-continue">Play Again</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
